name: Dashboards

# GitHub serves a repository's .html as source, so a README link to
# submission_artifacts/dashboard.html shows markup instead of the dashboard.
# This publishes the same committed files to GitHub Pages, where a browser
# renders them:  https://rahulni.github.io/Indic_LLM/
#
# Nothing is regenerated here. The dashboards are copied verbatim out of the
# repository, so the published page cannot disagree with the committed artifacts.

on:
  push:
    branches: [main]
    paths:
      - '6_build_dataset/submission_artifacts/dashboard.html'
      - '6_build_dataset/submission_artifacts_stdlib/dashboard.html'
      - '6_build_dataset/submission_artifacts*/evidence.json'
      - '6_build_dataset/submission_artifacts*/reports.json'
      - '6_build_dataset/tools/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install: build_pages.py is stdlib-only, verified by running it
      # with `regex` made unimportable.
      - name: Assemble the site from the committed dashboards
        working-directory: 6_build_dataset
        run: python tools/build_pages.py site

      - name: Fail if a dashboard reaches for the network
        working-directory: 6_build_dataset
        run: |
          if grep -rEl 'src="https?://|@import|fetch\(' site/*.html; then
            echo "::error::a published dashboard is not self-contained"
            exit 1
          fi
          echo "all pages are self-contained"

      # enablement: true turns Pages on the first time this runs, so the repo
      # needs no manual settings change.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # Relative to the workspace root: `working-directory` applies to `run`
          # steps only, never to an action's inputs.
          path: 6_build_dataset/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
